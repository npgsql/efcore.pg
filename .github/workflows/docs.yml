name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.x

      - name: Run Markdownlint
        run: |
          npm i -g markdownlint-cli
          markdownlint --config docs/.markdownlint.json "docs/**/*.md"

  dispatch:
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'npgsql/efcore.pg'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: npgsql
          repositories: doc

      - name: Trigger documentation build
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api --method POST repos/npgsql/doc/dispatches -f event_type=docs-changed
